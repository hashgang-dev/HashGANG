    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* HEADER */
      header {
        background: linear-gradient(135deg, #470470, #9911ee);
        color: white;
        padding: 10px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        position: relative;
      }

      .logo-container {
        display: flex;
        align-items: center;
      }

      .logo {
        width: 40px;
        height: 40px;
        margin-right: 10px;
      }

      .company-name {
        font-size: 1.5em;
        font-weight: bold;
      }

      /* NAV */
      nav {
        display: flex;
        gap: 15px;
        align-items: center;
        overflow: visible;
      }

      nav a,
      .dropdown-toggle {
        color: white;
        text-decoration: none;
        padding: 8px 12px;
        border-radius: 4px;
        font-size: 14px;
        white-space: nowrap;
        cursor: pointer;
        transition: background 0.3s;
      }

      nav a:hover,
      .dropdown-toggle:hover {
        background-color: rgba(255, 255, 255, 0.15);
      }

      /* DROPDOWN WRAPPER */
      .nav-item {
        position: relative;
      }

      /* DROPDOWN MENU (DESKTOP) */
      .dropdown-menu {
        position: absolute;
        top: 100%;
        left: 0;

        min-width: 200px;
        background: linear-gradient(135deg, #470470, #9911ee);
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);

        display: none;
        flex-direction: column;

        z-index: 9999;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      .dropdown-menu a {
        padding: 10px 14px;
        color: white;
      }

      .dropdown-menu a:hover {
        background: rgba(0, 0, 0, 0.2);
      }

      .dropdown.open .dropdown-menu {
        display: flex;
      }

      /* MOBILE MENU BUTTON */
      .menu-toggle {
        display: none;
        font-size: 1.8em;
        cursor: pointer;
        position: absolute;
        right: 20px;
        top: 10px;
      }

      /* MOBILE */
      @media (max-width: 768px) {
        nav {
          flex-direction: column;
          width: 100%;
          display: none;
          margin-top: 10px;
          align-items: center;
          text-align: center;
        }

        nav.show {
          display: flex;
        }

        .menu-toggle {
          display: block;
        }

        .nav-item,
        nav a,
        .dropdown-toggle {
          width: 100%;
          text-align: center;
        }

        /* MOBILE DROPDOWN */
        .dropdown-menu {
          position: relative;
          width: 100%;
          margin-top: 6px;
        }
      }

      iframe {
        flex-grow: 1;
        border: none;
        width: 100%;
        height: calc(100vh - 70px);
      }

      .whatsapp-float {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 60px;
        height: 60px;
        background-color: #25d366;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        z-index: 1000;
        cursor: pointer;
        animation: pulse 2s infinite;
        transition: transform 0.3s ease;
      }

      /* Icon */
      .whatsapp-float svg {
        width: 28px;
        height: 28px;
      }

      /* Hover lift effect */
      .whatsapp-float:hover {
        transform: translateY(-5px) scale(1.1);
      }

      /* Tooltip */
      .tooltip {
        position: absolute;
        right: 70px;
        background-color: #333;
        color: #fff;
        padding: 6px 10px;
        border-radius: 5px;
        font-size: 13px;
        white-space: nowrap;
        opacity: 0;
        transform: translateX(10px);
        transition: 0.3s;
      }

      /* Show tooltip on hover */
      .whatsapp-float:hover .tooltip {
        opacity: 1;
        transform: translateX(0);
      }

      /* Pulse animation */
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.6);
        }
        70% {
          box-shadow: 0 0 0 15px rgba(37, 211, 102, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
        }
      }

    <!-- JS -->
    <script>
      function toggleMenu() {
        document.getElementById("mainMenu").classList.toggle("show");
      }

      document.addEventListener("DOMContentLoaded", () => {
        const menu = document.getElementById("mainMenu");

        // TOGGLE DROPDOWN
        document.querySelectorAll(".dropdown-toggle").forEach((btn) => {
          btn.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();

            const parent = this.parentElement;

            document.querySelectorAll(".dropdown").forEach((d) => {
              if (d !== parent) d.classList.remove("open");
            });

            parent.classList.toggle("open");
          });
        });

        // CLOSE MENU ON LINK CLICK
        document
          .querySelectorAll("#mainMenu a:not(.dropdown-toggle)")
          .forEach((link) => {
            link.addEventListener("click", () => {
              menu.classList.remove("show");
              document
                .querySelectorAll(".dropdown")
                .forEach((d) => d.classList.remove("open"));
            });
          });

        // OUTSIDE CLICK CLOSE
        document.addEventListener("click", (e) => {
          document.querySelectorAll(".dropdown").forEach((dropdown) => {
            if (!dropdown.contains(e.target)) {
              dropdown.classList.remove("open");
            }
          });
        });
      });
    </script>
