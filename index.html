<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>#GANG</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="img/favicon.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      header {
        background-color: #470470;
        color: white;
        padding: 10px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        position: relative;
      }

      .logo-container {
        display: flex;
        align-items: center;
      }

      .logo {
        width: 40px;
        height: 40px;
        margin-right: 10px;
      }

      .company-name {
        font-size: 1.5em;
        font-weight: bold;
      }

      nav {
        display: flex;
        gap: 15px;
      }

      nav a {
        color: white;
        text-decoration: none;
        padding: 8px 12px;
        border-radius: 4px;
        transition: background-color 0.3s;
      }

      nav a:hover {
        background-color: #555;
      }

      .menu-toggle {
        display: none;
        font-size: 1.8em;
        cursor: pointer;
        position: absolute;
        right: 20px;
        top: 10px;
      }

      @media (max-width: 768px) {
        nav {
          flex-direction: column;
          width: 100%;
          display: none;
          margin-top: 10px;
        }

        nav.show {
          display: flex;
        }

        .menu-toggle {
          display: block;
        }

        header {
          flex-direction: row;
          align-items: center;
        }

        .logo-container {
          flex-grow: 1;
        }
      }

      iframe {
        flex-grow: 1;
        border: none;
        width: 100%;
        height: calc(100vh - 70px);
        /* Adjust for header height */
      }

      .whatsapp-float {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 60px;
        height: 60px;
        background-color: #25d366;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        z-index: 1000;
        cursor: pointer;
        animation: pulse 2s infinite;
        transition: transform 0.3s ease;
      }

      /* Icon */
      .whatsapp-float svg {
        width: 28px;
        height: 28px;
      }

      /* Hover lift effect */
      .whatsapp-float:hover {
        transform: translateY(-5px) scale(1.1);
      }

      /* Tooltip */
      .tooltip {
        position: absolute;
        right: 70px;
        background-color: #333;
        color: #fff;
        padding: 6px 10px;
        border-radius: 5px;
        font-size: 13px;
        white-space: nowrap;
        opacity: 0;
        transform: translateX(10px);
        transition: 0.3s;
      }

      /* Show tooltip on hover */
      .whatsapp-float:hover .tooltip {
        opacity: 1;
        transform: translateX(0);
      }

      /* Pulse animation */
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.6);
        }
        70% {
          box-shadow: 0 0 0 15px rgba(37, 211, 102, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="logo-container">
        <img src="img/logoGIF-v3.gif" alt="Logo" class="logo" />
        <div class="company-name">HashGANG</div>
      </div>
      <div class="menu-toggle" onclick="toggleMenu()">☰</div>
      <nav id="mainMenu">
        <a href="home.html#infinite" target="contentFrame">Home</a>
        <a href="home.html#whatwedo" target="contentFrame">What We Do</a>
        <a href="home.html#testimonials" target="contentFrame">Social Impact</a>
        <a href="home.html#gallery" target="contentFrame">About Us</a>
        <a href="home.html#contact" target="contentFrame">Contact</a>
        <!-- <a href="https://templatemo.com/page/1" target="contentFrame">Templates</a> -->
        <a href="careers.html" target="contentFrame">Careers</a>
        <!-- <a href="pricing.html" target="contentFrame">Pricing</a> -->
      </nav>
    </header>

    <iframe name="contentFrame" src="home.html#infinite" title="Embedded Page">
      Your browser does not support iframes.
    </iframe>

    <a
      href="https://wa.me/919133385950?text=Hi%20%23GANG"
      class="whatsapp-float"
      target="_blank"
      rel="noopener"
    >
      <span class="tooltip">Chat with us</span>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="white"
        class="w-7 h-7"
      >
        <path
          d="M20.52 3.48A11.86 11.86 0 0 0 12.06 0C5.48 0 .16 5.32.16 11.9c0 2.1.55 4.15 1.6 5.96L0 24l6.32-1.65a11.9 11.9 0 0 0 5.74 1.47h.01c6.58 0 11.9-5.32 11.9-11.9 0-3.18-1.24-6.16-3.45-8.44zM12.07 21.5a9.6 9.6 0 0 1-4.9-1.34l-.35-.2-3.75.98 1-3.66-.23-.37a9.62 9.62 0 1 1 8.23 4.59zm5.57-7.4c-.3-.15-1.76-.87-2.03-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.65.08-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.48-1.74-1.65-2.03-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.53.15-.18.2-.3.3-.5.1-.2.05-.38-.02-.53-.07-.15-.67-1.6-.92-2.18-.24-.58-.48-.5-.67-.51h-.56c-.2 0-.53.07-.8.36-.27.3-1.04 1-1.04 2.45 0 1.44 1.05 2.83 1.2 3.03.15.2 2.07 3.13 5 4.4.7.3 1.24.5 1.66.63.7.22 1.32.19 1.82.1.56-.09 1.73-.7 1.98-1.38.25-.68.25-1.25.17-1.38-.08-.12-.28-.2-.57-.35z"
        />
      </svg>
    </a>

    <script>
      function toggleMenu() {
        const menu = document.getElementById("mainMenu");
        menu.classList.toggle("show");
      }

      // Close menu after clicking a menu item (on mobile)
      document.addEventListener("DOMContentLoaded", () => {
        const menuLinks = document.querySelectorAll("#mainMenu a");
        const menu = document.getElementById("mainMenu");

        menuLinks.forEach((link) => {
          link.addEventListener("click", () => {
            // Only close menu if it's visible (mobile)
            if (window.innerWidth <= 768 && menu.classList.contains("show")) {
              menu.classList.remove("show");
            }
          });
        });
      });
    </script>
  </body>
</html>
