<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>#GANG</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="img/favicon.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* HEADER */
      header {
        background: linear-gradient(135deg, #470470, #9911ee);
        color: white;
        padding: 10px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        position: relative;
      }

      .logo-container {
        display: flex;
        align-items: center;
      }

      .logo {
        width: 40px;
        height: 40px;
        margin-right: 10px;
      }

      .company-name {
        font-size: 1.5em;
        font-weight: bold;
      }

      /* NAV */
      nav {
        display: flex;
        gap: 15px;
        align-items: center;
        overflow: visible;
      }

      nav a,
      .dropdown-toggle {
        color: white;
        text-decoration: none;
        padding: 8px 12px;
        border-radius: 4px;
        font-size: 14px;
        white-space: nowrap;
        cursor: pointer;
        transition: background 0.3s;
      }

      nav a:hover,
      .dropdown-toggle:hover {
        background-color: rgba(255, 255, 255, 0.15);
      }

      /* DROPDOWN WRAPPER */
      .nav-item {
        position: relative;
      }

      /* DROPDOWN MENU (DESKTOP) */
      .dropdown-menu {
        position: absolute;
        top: 100%;
        left: 0;

        min-width: 200px;
        background: linear-gradient(135deg, #470470, #9911ee);
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);

        display: none;
        flex-direction: column;

        z-index: 9999;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      .dropdown-menu a {
        padding: 10px 14px;
        color: white;
      }

      .dropdown-menu a:hover {
        background: rgba(0, 0, 0, 0.2);
      }

      .dropdown.open .dropdown-menu {
        display: flex;
      }

      /* MOBILE MENU BUTTON */
      .menu-toggle {
        display: none;
        font-size: 1.8em;
        cursor: pointer;
        position: absolute;
        right: 20px;
        top: 10px;
      }

      /* MOBILE */
      @media (max-width: 768px) {
        nav {
          flex-direction: column;
          width: 100%;
          display: none;
          margin-top: 10px;
          align-items: center;
          text-align: center;
        }

        nav.show {
          display: flex;
        }

        .menu-toggle {
          display: block;
        }

        .nav-item,
        nav a,
        .dropdown-toggle {
          width: 100%;
          text-align: center;
        }

        /* MOBILE DROPDOWN */
        .dropdown-menu {
          position: relative;
          width: 100%;
          margin-top: 6px;
        }
      }

      iframe {
        flex-grow: 1;
        border: none;
        width: 100%;
        height: calc(100vh - 70px);
      }

      .whatsapp-float {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 60px;
        height: 60px;
        background-color: #25d366;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        z-index: 1000;
        cursor: pointer;
        animation: pulse 2s infinite;
        transition: transform 0.3s ease;
      }

      /* Icon */
      .whatsapp-float svg {
        width: 28px;
        height: 28px;
      }

      /* Hover lift effect */
      .whatsapp-float:hover {
        transform: translateY(-5px) scale(1.1);
      }

      /* Tooltip */
      .tooltip {
        position: absolute;
        right: 70px;
        background-color: #333;
        color: #fff;
        padding: 6px 10px;
        border-radius: 5px;
        font-size: 13px;
        white-space: nowrap;
        opacity: 0;
        transform: translateX(10px);
        transition: 0.3s;
      }

      /* Show tooltip on hover */
      .whatsapp-float:hover .tooltip {
        opacity: 1;
        transform: translateX(0);
      }

      /* Pulse animation */
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.6);
        }
        70% {
          box-shadow: 0 0 0 15px rgba(37, 211, 102, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
        }
      }
    </style>
  </head>

  <body>

        <div class="company-name">HashGANG</div>

      <div class="menu-toggle" onclick="toggleMenu()">☰</div>
      <nav id="mainMenu">
        <a href="home.html#infinite" target="contentFrame">Home</a>

        <!-- DROPDOWN -->

            <a href="careers.html" target="contentFrame">Team Leader</a>

        <a href="home.html#contact" target="contentFrame">Contact</a>

        <!-- <a href="pricing.html" target="contentFrame">Pricing</a> -->
      </nav>
    </header>

    <iframe name="contentFrame" src="home.html#infinite"></iframe>

    <a

      <svg

        <path
          d="M20.52 3.48A11.86 11.86 0 0 0 12.06 0C5.48 0 .16 5.32.16 11.9c0 2.1.55 4.15 1.6 5.96L0 24l6.32-1.65a11.9 11.9 0 0 0 5.74 1.47h.01c6.58 0 11.9-5.32 11.9-11.9 0-3.18-1.24-6.16-3.45-8.44zM12.07 21.5a9.6 9.6 0 0 1-4.9-1.34l-.35-.2-3.75.98 1-3.66-.23-.37a9.62 9.62 0 1 1 8.23 4.59zm5.57-7.4c-.3-.15-1.76-.87-2.03-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.65.08-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.48-1.74-1.65-2.03-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.53.15-.18.2-.3.3-.5.1-.2.05-.38-.02-.53-.07-.15-.67-1.6-.92-2.18-.24-.58-.48-.5-.67-.51h-.56c-.2 0-.53.07-.8.36-.27.3-1.04 1-1.04 2.45 0 1.44 1.05 2.83 1.2 3.03.15.2 2.07 3.13 5 4.4.7.3 1.24.5 1.66.63.7.22 1.32.19 1.82.1.56-.09 1.73-.7 1.98-1.38.25-.68.25-1.25.17-1.38-.08-.12-.28-.2-.57-.35z"

    <script>
      function toggleMenu() {
        document.getElementById("mainMenu").classList.toggle("show");
      }

      document.addEventListener("DOMContentLoaded", () => {
        const menu = document.getElementById("mainMenu");

        // TOGGLE DROPDOWN
        document.querySelectorAll(".dropdown-toggle").forEach((btn) => {
          btn.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();

            const parent = this.parentElement;

            document.querySelectorAll(".dropdown").forEach((d) => {
              if (d !== parent) d.classList.remove("open");
            });

            parent.classList.toggle("open");
          });
        });

        // CLOSE MENU ON LINK CLICK
        document
          .querySelectorAll("#mainMenu a:not(.dropdown-toggle)")
          .forEach((link) => {
            link.addEventListener("click", () => {
              menu.classList.remove("show");
              document
                .querySelectorAll(".dropdown")
                .forEach((d) => d.classList.remove("open"));
            });
          });

        // OUTSIDE CLICK CLOSE
        document.addEventListener("click", (e) => {
          document.querySelectorAll(".dropdown").forEach((dropdown) => {
            if (!dropdown.contains(e.target)) {
              dropdown.classList.remove("open");
            }
          });
        });
      });
    </script>
  </body>
</html>
