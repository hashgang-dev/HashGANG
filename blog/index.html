<!-- /blog/index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>HashGang Insights</title>
    <meta
      name="description"
      content="Insights on productivity, performance management, workforce systems, and modern teams."
    />

    <link rel="stylesheet" href="./assets/css/blog.css" />

    <style>
      .menu-float {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 60px;
        height: 60px;
        background-color: #470470;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        z-index: 1000;
        cursor: pointer;
        animation: pulse 2s infinite;
        transition: transform 0.3s ease;
      }

      /* Icon */
      .menu-float svg {
        width: 28px;
        height: 28px;
      }

      /* Hover lift effect */
      .menu-float:hover {
        transform: translateY(-5px) scale(1.1);
      }

      /* Tooltip */
      .tooltip {
        position: absolute;
        right: 70px;
        background-color: #333;
        color: #fff;
        padding: 6px 10px;
        border-radius: 5px;
        font-size: 13px;
        white-space: nowrap;
        opacity: 0;
        transform: translateX(10px);
        transition: 0.3s;
      }

      /* Show tooltip on hover */
      .menu-float:hover .tooltip {
        opacity: 1;
        transform: translateX(0);
      }

      /* Pulse animation */
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.6);
        }
        70% {
          box-shadow: 0 0 0 15px rgba(37, 211, 102, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
        }
      }
    </style>
  </head>
  <body>
    <a id="homeBtn" href="/" class="menu-float" rel="noopener">
      <span class="tooltip">Home</span>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="white"
        class="w-7 h-7"
      >
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
      </svg>
    </a>
    <script>
      const homeBtn = document.getElementById("homeBtn");

      // iframe lo unte hide
      if (window.self !== window.top) {
        homeBtn.style.display = "none";
      } else {
        // direct URL aythe show
        homeBtn.style.display = "flex"; // or block
      }
    </script>

    <!-- HERO -->
    <section class="hero">
      <div class="container">
        <p class="hero-tag">HASHGANG INSIGHTS</p>

        <h1>Ideas for modern teams, productivity, and performance.</h1>

        <p class="hero-subtitle">
          Articles on workforce management, continuous evaluation, project
          execution, and team productivity.
        </p>
      </div>
    </section>

    <!-- BLOG LIST -->
    <main class="container">
      <section class="blog-section">
        <div id="blog-list" class="blog-grid">
          <!-- Dynamic blog cards render here -->
        </div>
      </section>
    </main>

    <script src="./assets/js/blog.js"></script>
  </body>
</html>
