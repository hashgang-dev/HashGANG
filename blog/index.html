    <style>
      .menu-float {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 60px;
        height: 60px;
        background-color: #470470;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        z-index: 1000;
        cursor: pointer;
        animation: pulse 2s infinite;
        transition: transform 0.3s ease;
      }

      /* Icon */
      .menu-float svg {
        width: 28px;
        height: 28px;
      }

      /* Hover lift effect */
      .menu-float:hover {
        transform: translateY(-5px) scale(1.1);
      }

      /* Tooltip */
      .tooltip {
        position: absolute;
        right: 70px;
        background-color: #333;
        color: #fff;
        padding: 6px 10px;
        border-radius: 5px;
        font-size: 13px;
        white-space: nowrap;
        opacity: 0;
        transform: translateX(10px);
        transition: 0.3s;
      }

      /* Show tooltip on hover */
      .menu-float:hover .tooltip {
        opacity: 1;
        transform: translateX(0);
      }

      /* Pulse animation */
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.6);
        }
        70% {
          box-shadow: 0 0 0 15px rgba(37, 211, 102, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
        }
      }
    </style>

    </a>

    <script>
      const homeBtn = document.getElementById("homeBtn");
