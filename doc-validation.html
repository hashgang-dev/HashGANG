<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>#GANG - Document Verification</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg1: #0f0f14;
        --bg2: #1b1430;
        --card: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.12);
        --text: #eaeaf0;
        --muted: rgba(234, 234, 240, 0.7);
        --green: #22c55e;
        --red: #ef4444;
        --primary: #8b5cf6;
        --radius: 18px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        min-height: 100vh;
        background: radial-gradient(circle at top, var(--bg2), var(--bg1) 60%);
        display: flex;
        flex-direction: column;
        color: var(--text);
      }

      /* MAIN */
      main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 16px;
      }

      /* CARD */
      .card {
        width: 100%;
        max-width: 560px;
        background: var(--card);
        border: 1px solid var(--border);
        backdrop-filter: blur(14px);
        border-radius: var(--radius);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        padding: 32px;
        text-align: center;
      }

      h1 {
        font-size: 22px;
        margin-bottom: 18px;
        font-weight: 600;
      }

      /* INPUT */
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.2);
        color: var(--text);
        outline: none;
        margin-bottom: 12px;
        font-size: 14px;
        transition: 0.2s ease;
      }

      input:focus {
        border-color: var(--primary);
      }

      /* BUTTON */
      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #7c3aed, #a855f7);
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s ease;
      }

      button:hover {
        transform: translateY(-2px);
      }

      /* RESULT BOX */
      .doc-details {
        margin-top: 20px;
        text-align: left;
      }

      .valid {
        color: var(--green);
        font-weight: 600;
        margin-bottom: 10px;
        text-align: center;
      }

      .invalid {
        color: var(--red);
        font-weight: 600;
        text-align: center;
      }

      .doc-content {
        margin-top: 15px;
        padding: 18px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        font-size: 14px;
        line-height: 1.7;
      }

      /* HEADER (if footer/header comes later) */
      header {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(10px);
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
      }

      /* FOOTER */
      footer {
        text-align: center;
        padding: 20px;
        color: var(--muted);
        border-top: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.02);
      }

      /* RESPONSIVE */
      @media (max-width: 600px) {
        .card {
          padding: 22px;
        }

        h1 {
          font-size: 18px;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <div class="card">
        <h1>Verify Certificate</h1>

        <input type="text" id="docInput" placeholder="Enter Certificate No" />
        <button onclick="verifyDoc()">Verify</button>

        <div id="result" class="doc-details"></div>
      </div>
    </main>

    <!-- FOOTER LOAD START -->
    <div id="footer"></div>
    <!-- FOOTER LOAD END -->

    <script>
      // FOOTER LOAD START
      async function loadComponent(id, file) {
        const res = await fetch(file);
        document.getElementById(id).innerHTML = await res.text();
      }
      loadComponent("footer", "footer.html");
      // FOOTER LOAD END

      const documents = {
        "HRD/INT-P/251006004": {
          data: `
      <p style="margin-top: 10px; font-size: 16px; line-height: 1.6;">
            This is to certify that <b><u>MANDADAPU SARANYA</u></b> (ID: <b>251006004</b>) participated in the 
            <b>Internship Program (Software Development)</b> with <b>Hashgang Solutions Private Limited</b>, located at 
            <i>21-10/2-239, Vijayawada, Andhra Pradesh, India – 520003</i>.
        </p>

        <p style="margin-top: 10px; font-size: 16px; line-height: 1.6;">
            The internship was undertaken in <b>Remote mode</b> from <b><u>Oct 6, 2025</u></b> to <b><u>Jan 19, 2026</u></b>.
        </p>

        <p style="margin-top: 10px; font-size: 16px; line-height: 1.6;">
            During this period, the intern completed <b><u>370 hours</u></b> of internship training and project-related assignments. 
            The intern carried out the assigned tasks with sincerity and demonstrated <b>foundational technical understanding</b> and 
            <b>professional conduct</b>.
        </p>

        <p style="margin-top: 10px; font-size: 16px; line-height: 1.6;">
            The internship was concluded upon securing a professional employment opportunity. This certificate acknowledges the intern’s participation and contribution during the tenure with the organization.
        </p>

        <p style="margin-top: 40px; font-size: 16px;">
            <b>Certificate No:</b> <b><u>HRD/INT-P/251006004</u></b>
        </p>
    `,
        },

        "HRD/INT-P/251006003": {
          data: `
      <p style="margin-top: 10px; font-size: 16px; line-height: 1.6;">
            This is to certify that <b><u>MARADANA BALAJI</u></b> (ID: <b>251006003</b>) participated in the 
            <b>Internship Program (Software Development)</b> with <b>Hashgang Solutions Private Limited</b>, located at 
            <i>21-10/2-239, Vijayawada, Andhra Pradesh, India – 520003</i>.
        </p>

        <p style="margin-top: 10px; font-size: 16px; line-height: 1.6;">
            The internship was undertaken in <b>Remote mode</b> from <b><u>Oct 6, 2025</u></b> to <b><u>Jan 21, 2026</u></b>.
        </p>

        <p style="margin-top: 10px; font-size: 16px; line-height: 1.6;">
            During this period, the intern completed <b><u>410 hours</u></b> of internship training and project-related assignments. 
            The intern carried out the assigned tasks with sincerity and demonstrated <b>foundational technical understanding</b> and 
            <b>professional conduct</b>.
        </p>

        <p style="margin-top: 10px; font-size: 16px; line-height: 1.6;">
            The internship was concluded upon securing a professional employment opportunity. This certificate acknowledges the intern’s participation and contribution during the tenure with the organization.
        </p>

        <p style="margin-top: 40px; font-size: 16px;">
            <b>Certificate No:</b> <b><u>HRD/INT-P/251006003</u></b>
        </p>
    `,
        },
      };

      function verifyDoc() {
        const docId = document.getElementById("docInput").value.trim();
        const resultDiv = document.getElementById("result");

        if (docId && documents[docId]) {
          resultDiv.innerHTML = `
            <p class="valid">Certificate is VALID ✅</p>
            <div class="doc-content">
              ${documents[docId].data}
            </div>
          `;
        } else {
          resultDiv.innerHTML = `
            <p class="invalid">Invalid Certificate No ❌</p>
          `;
        }
      }

      document
        .getElementById("docInput")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") {
            verifyDoc();
          }
        });
    </script>
  </body>
</html>
