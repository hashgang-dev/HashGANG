<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>#GANG - Document Verification</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        background: #f4f6f8;
        display: flex;
        flex-direction: column;
      }

      header {
        background-color: #470470;
        color: white;
        padding: 10px 20px;
        display: flex;
        align-items: center;
      }

      .logo-container {
        display: flex;
        align-items: center;
      }

      .logo {
        width: 50px;
        height: 50px;
        margin-right: 10px;
      }

      .company-name {
        font-size: 1.8em;
        font-weight: bold;
      }

      main {
        flex-grow: 1;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 20px;
      }

      .card {
        background: #fff;
        border-radius: 12px;
        padding: 30px;
        max-width: 500px;
        width: 100%;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        text-align: center;
        margin-top: 40px;
      }

      h1 {
        margin-bottom: 20px;
        color: #2c3e50;
      }

      input {
        padding: 10px;
        width: 80%;
        margin-bottom: 15px;
        border-radius: 6px;
        border: 1px solid #ccc;
      }

      button {
        padding: 10px 20px;
        background: #470470;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      button:hover {
        background: #5e0a8c;
      }

      .valid {
        color: #27ae60;
        font-weight: bold;
        font-size: 1.2rem;
        margin-bottom: 15px;
      }

      .invalid {
        color: #c0392b;
        font-weight: bold;
        font-size: 1.2rem;
        margin-bottom: 15px;
      }

      .doc-details p {
        margin: 10px 0;
        font-size: 1rem;
      }

      .doc-content {
        text-align: left;
      }
    </style>
  </head>

  <body>
    <main>
      <div class="card">
        <h1>Verify Certificate</h1>

        <input type="text" id="docInput" placeholder="Enter Certificate No" />

        <br />

        <button onclick="verifyDoc()">Verify</button>

        <div id="result" class="doc-details" style="margin-top: 20px"></div>
      </div>
    </main>

    <!-- FOOTER LOAD START -->
    <div id="footer"></div>
    <!-- FOOTER LOAD END -->

    <script>
      // FOOTER LOAD START
      async function loadComponent(id, file) {
        const res = await fetch(file);
        document.getElementById(id).innerHTML = await res.text();
      }
      loadComponent("footer", "footer.html");
      // FOOTER LOAD END

      const documents = {
        "HRD/INT-P/251006004": {
          data: `
      <p style="margin-top: 40px; font-size: 16px; line-height: 1.6;">
            This is to certify that <b><u>MANDADAPU SARANYA</u></b> (ID: <b>251006004</b>) participated in the 
            <b>Internship Program (Software Development)</b> with <b>Hashgang Solutions Private Limited</b>, located at 
            <i>21-10/2-239, Vijayawada, Andhra Pradesh, India – 520003</i>.
        </p>

        <p style="font-size: 16px; line-height: 1.6;">
            The internship was undertaken in <b>Remote mode</b> from <b><u>Oct 6, 2025</u></b> to <b><u>Jan 19, 2026</u></b>.
        </p>

        <p style="font-size: 16px; line-height: 1.6;">
            During this period, the intern completed <b><u>370 hours</u></b> of internship training and project-related assignments. 
            The intern carried out the assigned tasks with sincerity and demonstrated <b>foundational technical understanding</b> and 
            <b>professional conduct</b>.
        </p>

        <p style="font-size: 16px; line-height: 1.6;">
            The internship was concluded upon securing a professional employment opportunity. This certificate acknowledges the intern’s participation and contribution during the tenure with the organization.
        </p>

        <p style="margin-top: 40px; font-size: 16px;">
            <b>Certificate No:</b> <b><u>HRD/INT-P/251006004</u></b>
        </p>
    `,
        },

        "HRD/INT-P/251006003": {
          data: `
        <p style="margin-top: 40px; font-size: 16px; line-height: 1.6;">
            This is to certify that <b><u>MARADANA BALAJI</u></b> (ID: <b>251006003</b>) participated in the 
            <b>Internship Program (Software Development)</b> with <b>Hashgang Solutions Private Limited</b>, located at 
            <i>21-10/2-239, Vijayawada, Andhra Pradesh, India – 520003</i>.
        </p>

        <p style="font-size: 16px; line-height: 1.6;">
            The internship was undertaken in <b>Remote mode</b> from <b><u>Oct 6, 2025</u></b> to <b><u>Jan 21, 2026</u></b>.
        </p>

        <p style="font-size: 16px; line-height: 1.6;">
            During this period, the intern completed <b><u>410 hours</u></b> of internship training and project-related assignments. 
            The intern carried out the assigned tasks with sincerity and demonstrated <b>foundational technical understanding</b> and 
            <b>professional conduct</b>.
        </p>

        <p style="font-size: 16px; line-height: 1.6;">
            The internship was concluded upon securing a professional employment opportunity. This certificate acknowledges the intern’s participation and contribution during the tenure with the organization.
        </p>

        <p style="margin-top: 40px; font-size: 16px;">
            <b>Certificate No:</b> <b><u>HRD/INT-P/251006003</u></b>
        </p>
    `,
        },
      };

      function verifyDoc() {
        const docId = document.getElementById("docInput").value.trim();
        const resultDiv = document.getElementById("result");

        if (docId && documents[docId]) {
          const doc = documents[docId];

          resultDiv.innerHTML = `
            <p class="valid">Certificate is VALID ✅</p>
            <p><strong>Verified Details:</strong></p>
            <div class="doc-content">
              ${doc.data}
            </div>
          `;
        } else {
          resultDiv.innerHTML = `
            <p class="invalid">Invalid Certificate ID ❌</p>
          `;
        }
      }

      // Enter key support
      document
        .getElementById("docInput")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") {
            verifyDoc();
          }
        });
    </script>
  </body>
</html>
