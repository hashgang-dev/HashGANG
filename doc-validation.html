      :root {

      * {

      }

      body {
        font-family: "Poppins", sans-serif;

        justify-content: center;
        align-items: center;
        padding: 40px 16px;
      }

      /* CARD */
      .card {
        width: 100%;
        max-width: 560px;
        background: var(--card);
        border: 1px solid var(--border);
        backdrop-filter: blur(14px);
        border-radius: var(--radius);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        padding: 32px;
        text-align: center;
      }

      h1 {
        font-size: 22px;
        margin-bottom: 18px;
        font-weight: 600;
      }

      /* INPUT */
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.2);
        color: var(--text);
        outline: none;
        margin-bottom: 12px;
        font-size: 14px;
        transition: 0.2s ease;
      }

      input:focus {
        border-color: var(--primary);
      }

      /* BUTTON */
      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #7c3aed, #a855f7);
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s ease;
      }

      button:hover {
        transform: translateY(-2px);
      }

      /* RESULT BOX */
      .doc-details {
        margin-top: 20px;
        text-align: left;
      }

      .valid {
        color: var(--green);
        font-weight: 600;
        margin-bottom: 10px;
        text-align: center;
      }

      .invalid {
        color: var(--red);
        font-weight: 600;
        text-align: center;
      }

      .doc-content {
        margin-top: 15px;
        padding: 18px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        font-size: 14px;
        line-height: 1.7;
      }

      /* HEADER (if footer/header comes later) */
      header {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(10px);
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
      }

      /* FOOTER */
      footer {
        text-align: center;
        padding: 20px;
        color: var(--muted);
        border-top: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.02);

      @media (max-width: 600px) {
        .card {
          padding: 22px;
        }

        h1 {
          font-size: 18px;
        }
      }
    </style>
